<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off the Hook Brand</title>
  <!-- DEV ONLY: generates icons/*.png and the wordmark. The extension itself never loads web fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #f2f2f2; color: #222; }
    @media (prefers-color-scheme: dark) { body { background: #151515; color: #eee; } }
    h1 { font-size: 18px; }
    .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin: 16px 0; }
    .tile { display: grid; gap: 6px; justify-items: center; font-size: 12px; }
    .bg { padding: 12px; border-radius: 8px; }
    .light { background: #ffffff; } .dark { background: #202124; }
    canvas { image-rendering: auto; }
    button { font: inherit; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1>Off the Hook: icon and wordmark generator</h1>
  <p>Open via <code>python scripts/brand_server.py</code>, then click Save to write <code>icons/</code>. Shown on light and dark toolbars.</p>
  <div class="row" id="icons"></div>
  <div class="row" id="marks"></div>
  <button id="save" type="button">Save PNGs to icons/</button> <span id="status"></span>

<script>
'use strict';
const LIME = '#a6ff00', INK = '#111111', SPLAT = '#26282b', PINK = '#ff2e88', WHITE = '#ffffff';

// Seeded random so the splatter is identical every time.
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

// Graffiti sticker icon: round badge, hard pink offset shadow, snapped fishing hook.
// detail: 'full' (48 px and up), 'simple' (32 px), 'tiny' (16 px). Smaller = fewer details, bolder lines.
function iconSVG(detail) {
  const full = detail === 'full', tiny = detail === 'tiny';
  const BADGE = '#1d1f22';
  // Badge position and size; tiny fills the whole square so the toolbar icon stays big.
  const cx = tiny ? 64 : 60, cy = tiny ? 64 : 58, r = tiny ? 61 : full ? 50 : 54;
  const shadow = tiny ? '' : `<circle cx="${cx + (full ? 7 : 6)}" cy="${cy + (full ? 7 : 6)}" r="${r}" fill="${PINK}"/>`;
  // Two smooth paint drips running off the bottom of the badge (behind it, so they emerge from the rim).
  // Pink paint running off the bottom of the pink shadow.
  const drips = full ? `
    <g fill="${PINK}">
      <path d="M53 108 V118 a4.5 4.5 0 0 0 9 0 V106 Z"/>
      <path d="M78 104 V111 a3.5 3.5 0 0 0 7 0 V101 Z"/>
    </g>` : '';
  const badge = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${BADGE}" stroke="${INK}" stroke-width="${tiny ? 6 : 5}"/>`;
  // Faint lime "spray" glow inside the badge (full size only).
  const glow = full ? `<circle cx="${cx}" cy="${cy}" r="${r - 4}" fill="url(#glow)"/>` : '';

  // Hook: eye, shank, bend, barbed point. The bend is SNAPPED and the point piece knocked loose.
  const tilt = 'rotate(-10 46 92) translate(-2 3)';
  const ow = full ? 16 : tiny ? 22 : 19, cw = full ? 9 : tiny ? 13 : 11;
  const layer = (color, w) => `
    <g fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="70" cy="25" r="7.5"/>
      <path d="M70 33 V68 C70 84 63 92 55 93.5"/>
      <g transform="${tilt}"><path d="M46 92.5 C38 90 34 82 34 72 V50"/></g>
    </g>`;
  // Tapered point (same width as the line, so it reads as a hook point, not an arrow).
  const tip = (color, w) => `<g transform="${tilt}"><path d="M${34 - w / 2} 50 L34 ${41 - w * 0.45} L${34 + w / 2} 50 Z" fill="${color}"/></g>`;
  const shine = full ? `
    <g stroke="${WHITE}" stroke-linecap="round" stroke-width="2.6">
      <path d="M66.5 38 V54"/><path d="M66.5 59 V62"/>
      <g transform="${tilt}"><path d="M30.6 64 V72"/></g>
    </g>` : '';
  // Pink "snap" sparks at the break.
  const spark = tiny ? '' : `
    <g stroke="${PINK}" stroke-linecap="round" stroke-width="${full ? 3.4 : 4.5}">
      <path d="M51 100 V107"/><path d="M57 98 L62 103"/><path d="M45 98 L40 103"/>${full ? '<path d="M51 85 V81"/>' : ''}
    </g>`;
  const hookScale = tiny ? 'translate(64 62) scale(1.12) translate(-52 -60)' : full ? 'translate(60 57) scale(0.92) translate(-52 -60)' : 'translate(60 57) scale(1.02) translate(-52 -60)';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <radialGradient id="glow" cx="35%" cy="30%" r="75%">
        <stop offset="0" stop-color="${LIME}" stop-opacity="0.22"/>
        <stop offset="0.55" stop-color="${LIME}" stop-opacity="0.05"/>
        <stop offset="1" stop-color="${LIME}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    ${shadow}
    ${drips}
    ${badge}
    ${glow}
    <g transform="${hookScale}">
      ${layer(INK, ow)}${tip(INK, ow)}
      ${layer(LIME, cw)}${tip(LIME, cw)}
      ${shine}
      ${spark}
    </g>
  </svg>`;
}

function svgToCanvas(svg, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, size, size);
      resolve(c);
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

// Wordmark: drippy spray-paint letters, solid ink outline + 3D drop, one tapered pink brush stroke.
async function wordmark(scale) {
  await document.fonts.load('96px "Rubik Wet Paint"');
  const W = 760 * scale, H = 190 * scale;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.translate(W / 2, H / 2 + 2 * scale);
  ctx.rotate(-0.035);
  // Tapered brush stroke under the letters (thin, thick in the middle, thin), drawn first.
  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(-318 * scale, 66 * scale);
  ctx.quadraticCurveTo(-40 * scale, 80 * scale, 312 * scale, 54 * scale);
  ctx.quadraticCurveTo(318 * scale, 58 * scale, 300 * scale, 62 * scale);
  ctx.quadraticCurveTo(-40 * scale, 94 * scale, -318 * scale, 70 * scale);
  ctx.closePath(); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${92 * scale}px "Rubik Wet Paint", Impact, sans-serif`;
  ctx.lineJoin = 'round';
  const text = 'OFF THE HOOK';
  // Solid 3D drop.
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = 14 * scale;
  for (let i = 1; i <= 7; i++) { ctx.strokeText(text, i * scale, i * scale); ctx.fillText(text, i * scale, i * scale); }
  // Outline + lime fill.
  ctx.strokeText(text, 0, 0);
  const g = ctx.createLinearGradient(0, -48 * scale, 0, 48 * scale);
  g.addColorStop(0, '#d4ff5e'); g.addColorStop(0.5, LIME); g.addColorStop(1, '#7ed400');
  ctx.fillStyle = g; ctx.fillText(text, 0, 0);
  // Thin, soft highlight across the top of the letters only.
  ctx.save();
  const t = document.createElement('canvas'); t.width = W; t.height = H;
  const tc = t.getContext('2d');
  tc.setTransform(ctx.getTransform());
  tc.textAlign = 'center'; tc.textBaseline = 'middle'; tc.font = ctx.font;
  tc.fillStyle = '#fff'; tc.fillText(text, 0, 0);
  tc.globalCompositeOperation = 'source-in';
  tc.setTransform(1, 0, 0, 1, 0, 0);
  const hg = tc.createLinearGradient(0, 0, 0, H);
  hg.addColorStop(0.28, 'rgba(255,255,255,0)'); hg.addColorStop(0.33, 'rgba(255,255,255,0.45)'); hg.addColorStop(0.37, 'rgba(255,255,255,0)');
  tc.fillStyle = hg; tc.fillRect(0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(t, 0, 0);
  ctx.restore();
  return trim(c, 6 * scale);
}

// Crop a canvas to its non-transparent pixels plus padding.
function trim(c, pad) {
  const { width: W, height: H } = c;
  const d = c.getContext('2d').getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

// README hero banner / GitHub social preview: ink "wall" with spray paint, logo, wordmark, tagline.
async function banner(W, H, opts) {
  const o = opts || {};
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const R = o.radius == null ? 36 : o.radius;
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, R); ctx.clip();
  // Wall + spray clouds.
  ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, W, H);
  const cloud = (x, y, r, color) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  cloud(W * 0.2, H * 0.5, H * 0.75, 'rgba(166,255,0,0.16)');
  cloud(W * 0.72, H * 0.38, H * 0.95, 'rgba(255,46,136,0.13)');
  // Speckle.
  const r = rng(99);
  for (let i = 0; i < W * H / 900; i++) {
    const x = r() * W, y = r() * H, s = r() * 1.8 + 0.3;
    ctx.fillStyle = r() < 0.5 ? 'rgba(166,255,0,' + (0.05 + r() * 0.18) + ')' : 'rgba(255,46,136,' + (0.05 + r() * 0.16) + ')';
    ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
  }

  // Logo.
  const logoSize = H * (o.logoScale || 0.62);
  const logo = await svgToCanvas(iconSVG('full'), Math.round(logoSize));
  const lx = W * 0.05, ly = (H - logoSize) / 2 - H * 0.03;
  ctx.drawImage(logo, lx, ly);
  // Wordmark.
  const wm = await wordmark(2);
  const ww = W - lx - logoSize - W * 0.08, wh = ww * wm.height / wm.width;
  const wx = lx + logoSize + W * 0.03;
  // Center the wordmark + tagline block vertically.
  const blockH = wh + H * 0.2;
  const wy = o.wordTop != null ? H * o.wordTop : (H - blockH) / 2 - H * 0.02;
  ctx.drawImage(wm, wx, wy, ww, wh);
  // Tagline.
  const tx = wx + ww * 0.06, ty = wy + wh * 0.98, maxW = ww * 0.92;
  // Shrink each line until it fits the space under the wordmark.
  const fit = (text, start, family) => {
    let size = Math.round(start);
    do { ctx.font = family.replace('{s}', size); } while (ctx.measureText(text).width > maxW && --size > 8);
    return size;
  };
  ctx.textBaseline = 'top';
  const ts = fit(o.tagline, H * 0.085, 'italic 900 {s}px Impact, "Arial Black", sans-serif');
  ctx.fillStyle = PINK; ctx.fillText(o.tagline, tx + 3, ty + 3);
  ctx.fillStyle = '#f2f3ee'; ctx.fillText(o.tagline, tx, ty);
  fit(o.sub, H * 0.05, '700 {s}px Consolas, "SFMono-Regular", ui-monospace, monospace');
  ctx.fillStyle = LIME; ctx.fillText(o.sub, tx, ty + ts * 1.35);
  // Pink header stripe along the bottom, like every Off the Hook screen.
  ctx.fillStyle = PINK; ctx.fillRect(0, H - H * 0.03, W, H * 0.03);
  return c;
}

const outputs = {};
function tile(where, canvas, label, cls) {
  const t = document.createElement('div'); t.className = 'tile';
  const box = document.createElement('div'); box.className = 'bg ' + cls;
  const show = document.createElement('img'); show.src = canvas.toDataURL('image/png');
  show.width = canvas.width > 200 ? canvas.width / 2 : canvas.width; show.alt = label;
  box.append(show); t.append(box, label + (cls ? ' (' + cls + ')' : '')); document.getElementById(where).append(t);
}

async function build() {
  for (const size of [16, 32, 48, 128]) {
    const c = await svgToCanvas(iconSVG(size >= 48 ? 'full' : size >= 32 ? 'simple' : 'tiny'), size);
    outputs['icon' + size + '.png'] = c.toDataURL('image/png');
    tile('icons', c, size + 'px', 'light'); tile('icons', c, size + 'px', 'dark');
  }
  const big = await svgToCanvas(iconSVG('full'), 512);
  outputs['logo512.png'] = big.toDataURL('image/png');
  const wm = await wordmark(2);
  outputs['wordmark.png'] = wm.toDataURL('image/png');
  tile('marks', wm, 'wordmark', 'light'); tile('marks', wm, 'wordmark', 'dark');
  const text = { tagline: 'PHISHING DETECTION THAT LIVES IN YOUR INBOX', sub: 'Gmail · Outlook · runs 100% on your computer · optional AI' };
  const hero = await banner(1600, 480, Object.assign({ logoScale: 0.74 }, text));
  outputs['banner.png'] = hero.toDataURL('image/png');
  tile('marks', hero, 'README banner', 'light'); tile('marks', hero, 'README banner', 'dark');
  // GitHub social preview (Settings > Social preview): 1280x640, square corners.
  const social = await banner(1280, 640, Object.assign({ radius: 0, logoScale: 0.56 }, text));
  outputs['social-preview.png'] = social.toDataURL('image/png');
  tile('marks', social, 'social preview', 'dark');
}

document.getElementById('save').addEventListener('click', async () => {
  const st = document.getElementById('status');
  for (const [name, url] of Object.entries(outputs)) {
    const res = await fetch('/save/' + name, { method: 'POST', body: url.split(',')[1] });
    if (!res.ok) { st.textContent = 'Save failed for ' + name; return; }
  }
  st.textContent = 'Saved ' + Object.keys(outputs).join(', ');
});

window.brandReady = build();
</script>
</body>
</html>
