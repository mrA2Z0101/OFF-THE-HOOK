<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off the Hook Tests</title>
  <style>
    :root { color-scheme: light dark; --ok: #1b7f3b; --bad: #c62828; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --ok: #3fb763; --bad: #ff6b63; --muted: #aaa; } body { background: #16191d; color: #e6edf3; } }
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    #summary { font-weight: 700; font-size: 16px; }
    li { margin: 3px 0; }
    .pass::before { content: "✓ PASS  "; color: var(--ok); font-weight: 700; }
    .fail::before { content: "✗ FAIL  "; color: var(--bad); font-weight: 700; }
    .err { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .ms { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Off the Hook analyzer tests (browser runner)</h1>
  <p>Serve the extension folder over HTTP (for example <code>python -m http.server 8765</code> in the PhishGuard folder) and open <code>http://localhost:8765/test/</code>. The same cases run in Node with <code>node --test test/</code>.</p>
  <p id="summary" role="status">Running…</p>
  <ul id="results"></ul>

  <script src="../shared/config.js"></script>
  <script src="../shared/domain-utils.js"></script>
  <script src="../shared/analyzer.js"></script>
  <script src="../shared/ai-utils.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="../shared/qr.js"></script>
  <script src="../shared/filecheck.js"></script>
  <script src="../shared/sensitive.js"></script>
  <script src="../shared/blocklist.js"></script>
  <script src="../shared/eml.js"></script>
  <script src="../shared/scoreboard.js"></script>
  <script src="../shared/learnmd.js"></script>
  <script src="samples.js"></script>
  <script src="qr-fixtures.js"></script>
  <script src="cases.js"></script>
  <script src="qr-cases.js"></script>
  <script src="file-cases.js"></script>
  <script src="reply-cases.js"></script>
  <script src="intel-cases.js"></script>
  <script src="score-cases.js"></script>
  <script src="learn-cases.js"></script>
  <script>
    (async function () {
      const fail = msg => { throw new Error(msg); };
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const assert = {
        ok: (v, m) => v || fail(m || 'expected truthy value'),
        equal: (a, b, m) => a === b || fail((m ? m + ': ' : '') + 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a)),
        deepEqual: (a, b, m) => same(a, b) || fail((m ? m + ': ' : '') + 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a))
      };
      const tests = [];
      const test = (name, fn) => tests.push({ name, fn });
      const load = f => fetch('../data/' + f).then(r => r.json());
      const lists = { keywords: await load('keywords.json'), brands: await load('brands.json') };
      const env = { test, assert, PG: window.PhishGuard, lists, samples: window.PhishGuardSamples, qrFixtures: window.PhishGuardQrFixtures };
      window.PhishGuardTestCases(env);
      window.PhishGuardQrCases(env);
      window.PhishGuardFileCases(env);
      window.PhishGuardReplyCases(env);
      window.PhishGuardIntelCases(env);
      window.PhishGuardScoreCases(env);
      window.PhishGuardLearnCases(env);

      const ul = document.getElementById('results');
      let passed = 0;
      for (const t of tests) {
        const li = document.createElement('li');
        const t0 = performance.now();
        try { await t.fn(); li.className = 'pass'; passed++; }
        catch (e) {
          li.className = 'fail';
          const pre = document.createElement('div'); pre.className = 'err'; pre.textContent = e.message;
          li.append(pre);
        }
        li.prepend(t.name + ' ');
        const ms = document.createElement('span'); ms.className = 'ms'; ms.textContent = `(${(performance.now() - t0).toFixed(1)} ms)`;
        li.insertBefore(ms, li.childNodes[1] || null);
        ul.append(li);
      }
      const s = document.getElementById('summary');
      s.textContent = `${passed} / ${tests.length} passed`;
      s.style.color = passed === tests.length ? 'var(--ok)' : 'var(--bad)';
      document.title = (passed === tests.length ? 'PASS ' : 'FAIL ') + document.title;
    })().catch(e => { document.getElementById('summary').textContent = 'Runner error: ' + e.message; });
  </script>
</body>
</html>
